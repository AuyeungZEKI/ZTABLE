<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<style>
* { margin:0; padding:0; box-sizing:border-box; cursor:crosshair; }
html,body { width:100%; height:100%; overflow:hidden; background:rgba(10,14,22,.10); }
.wrap { position:absolute; inset:0; }
.sel { position:absolute; border:1.5px solid #3B82F6; background:rgba(59,130,246,.16); border-radius:8px; display:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.4) inset, 0 10px 40px rgba(37,99,235,.3); }
.tip { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font:600 14px/1.5 "Segoe UI","Microsoft YaHei UI",sans-serif;
  background:rgba(20,22,28,.78); border:1px solid rgba(255,255,255,.14); padding:14px 20px; border-radius:14px; text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.35); pointer-events:none; }
.tip small { display:block; font-weight:400; opacity:.65; font-size:12px; margin-top:4px; }
.tag { position:absolute; background:#2563EB; color:#fff; font:600 11px/1 "Segoe UI","Microsoft YaHei UI"; padding:5px 8px; border-radius:6px; display:none; }
</style></head>
<body><div class="wrap"><div class="sel" id="sel"></div><div class="tag" id="tag"></div></div>
<div class="tip" id="tip">拖拽框出你的第一个围栏<small>按住左键拖拽 · Esc 取消</small></div>
<script src="overlay.js"></script></body></html>
