<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; background:transparent; overflow:hidden; }
body { display:grid; place-items:center; }
.box { width:100%; height:100%; border:1.5px solid #3B82F6; border-radius:10px; background:rgba(59,130,246,.14);
  box-shadow:0 0 0 1px rgba(255,255,255,.35) inset, 0 8px 30px rgba(37,99,235,.28); position:relative; }
.size { position:absolute; top:-26px; left:0; background:#1F2430; color:#fff; font:600 11px/1 "Segoe UI","Microsoft YaHei UI",sans-serif;
  padding:5px 8px; border-radius:6px; white-space:nowrap; box-shadow:0 3px 10px rgba(0,0,0,.3); }
</style></head>
<body><div class="box"><div class="size" id="s">0 × 0</div></div>
<script src="selection.js"></script></body></html>
